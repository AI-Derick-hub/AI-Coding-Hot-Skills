name: Daily skill update

on:
  schedule:
    # 00:00 UTC is 08:00 Asia/Shanghai. China has no daylight-saving time.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-skill-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test catalog rules
        run: python3 scripts/test_skills_lib.py

      - name: Refresh skills and rebuild the site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update.py

      - name: Validate generated files
        run: python3 scripts/validate.py

      - name: Commit catalog and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs CHANGELOG.md site/index.html site/data site/.nojekyll
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "chore: daily skill update $(TZ=Asia/Shanghai date +%F)"
            git push origin HEAD:main
          fi
