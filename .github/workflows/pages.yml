name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Pushes made with the default GITHUB_TOKEN do not start other workflows.
  # The daily job commits the rebuilt site that way, so publish after it finishes.
  workflow_run:
    workflows: ["Daily skill update"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The daily job creates its commit during the run, so the workflow_run
          # head SHA is the commit it started from. Check out current main instead.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
